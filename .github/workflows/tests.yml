name: tests

on:
  push:
    branches: [develop, main, master, workos]
  pull_request:
    branches: [develop, main, master, workos]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: num_academy_test
          POSTGRES_USER: num_academy
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U num_academy -d num_academy_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: num_academy_test
      DB_USERNAME: num_academy
      DB_PASSWORD: ci-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      TOWER_ENABLED: true
      TOWER_MEMORY_ENABLED: true
      TOWER_MEMORY_SEMANTIC: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, redis

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Source contracts M07 through M15.1.1
        run: |
          for f in tests/Contracts/m07_academy_ai_contract.sh tests/Contracts/m08_mcp_gateway_contract.sh tests/Contracts/m09_tutor_contract.sh tests/Contracts/m10_sales_engine_contract.sh tests/Contracts/m11_page_builder_contract.sh tests/Contracts/m12_academy_factory_contract.sh; do bash "$f"; done
          for f in tests/Contract/M13MissionTowerFoundationContractTest.php tests/Contract/M13_1MissionTowerOperationsContractTest.php tests/Contract/M13_2AcademyObservatoryContractTest.php tests/Contract/M13_3MissionCompilerContractTest.php tests/Contract/M13_4TowerChatContractTest.php tests/Contract/M13_5DurableMemoryContractTest.php tests/Contract/M13_5_1CourseReleaseHardeningContractTest.php tests/Contract/M13_6CanonicalCourseDomainContractTest.php tests/Contract/M13_7OneBriefToCourseContractTest.php tests/Contract/M13_8TowerChatRichUxContractTest.php tests/Contract/M13_9CourseReviewVisualSystemContractTest.php tests/Contract/M14_1QuizAssessmentContractTest.php tests/Contract/M14_2AssignmentProjectContractTest.php tests/Contract/M14_2MissionTowerRuntimeCompatibilityContractTest.php tests/Contract/M14_3CompletionCertificatesContractTest.php tests/Contract/M14_4LearningFactoryIntegrationContractTest.php tests/Contract/M14_4_1RuntimeLauncherTowerProvisioningContractTest.php tests/Contract/M15_1LearningAccessDripContractTest.php tests/Contract/M15_1_1GitHubBaselineHardeningContractTest.php; do php "$f"; done

      - name: Validate Coolify Compose
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: ci-password
        run: docker compose -f docker-compose.coolify.yml config >/dev/null

      - name: Migrate PostgreSQL + pgvector
        run: php artisan migrate:fresh --force

      - name: Build client + SSR assets
        run: npm run build:ssr

      - name: TypeScript check after Wayfinder generation
        run: npm run types:check

      - name: Run application tests
        run: ./vendor/bin/pest

  coolify-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate Coolify Compose
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_PASSWORD: ci-password
        run: docker compose -f docker-compose.coolify.yml config >/dev/null

      - name: Build production image exactly like Coolify
        run: docker build --tag num-academy-os:ci .
