services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: ${APP_NAME:-NÜM Academy}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY in Coolify}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-fr}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}

      ACADEMY_NAME: ${ACADEMY_NAME:-NÜM Academy}
      ACADEMY_SHORT_NAME: ${ACADEMY_SHORT_NAME:-NÜM}
      ACADEMY_DESCRIPTOR: ${ACADEMY_DESCRIPTOR:-Academy OS}
      ACADEMY_LOGO_URL: ${ACADEMY_LOGO_URL:-}
      ACADEMY_THEME_PRESET: ${ACADEMY_THEME_PRESET:-soft-glass}
      ACADEMY_PRIMARY: ${ACADEMY_PRIMARY:-#6F7F70}
      ACADEMY_PRIMARY_HOVER: ${ACADEMY_PRIMARY_HOVER:-#576A59}
      ACADEMY_PRIMARY_SOFT: ${ACADEMY_PRIMARY_SOFT:-#EAF0E8}
      ACADEMY_PRIMARY_SURFACE: ${ACADEMY_PRIMARY_SURFACE:-#F4F7F2}
      ACADEMY_SECONDARY: ${ACADEMY_SECONDARY:-#202720}
      ACADEMY_ACCENT: ${ACADEMY_ACCENT:-#B79B72}
      ACADEMY_RADIUS: ${ACADEMY_RADIUS:-1rem}
      ACADEMY_DENSITY: ${ACADEMY_DENSITY:-comfortable}
      ACADEMY_VERSION: ${ACADEMY_VERSION:-1.5.2}
      ACADEMY_DEPLOYMENT_MODE: single-tenant
      ACADEMY_TEMPLATE_KEY: ${ACADEMY_TEMPLATE_KEY:-creator}
      ACADEMY_CAPABILITY_PROFILE: ${ACADEMY_CAPABILITY_PROFILE:-creator}
      ACADEMY_FACTORY_ENABLED: ${ACADEMY_FACTORY_ENABLED:-false}
      ACADEMY_FEATURE_COMMUNITY: ${ACADEMY_FEATURE_COMMUNITY:-true}
      ACADEMY_FEATURE_EVENTS: ${ACADEMY_FEATURE_EVENTS:-true}
      ACADEMY_FEATURE_AI: ${ACADEMY_FEATURE_AI:-true}
      ACADEMY_FEATURE_TUTOR: ${ACADEMY_FEATURE_TUTOR:-true}
      ACADEMY_FEATURE_SALES: ${ACADEMY_FEATURE_SALES:-true}
      ACADEMY_FEATURE_PAGES: ${ACADEMY_FEATURE_PAGES:-true}
      ACADEMY_FEATURE_MCP: ${ACADEMY_FEATURE_MCP:-true}
      ACADEMY_FEATURE_TOWER: ${ACADEMY_FEATURE_TOWER:-false}
      ACADEMY_FEATURE_ASSESSMENTS: ${ACADEMY_FEATURE_ASSESSMENTS:-true}
      ACADEMY_FEATURE_ASSIGNMENTS: ${ACADEMY_FEATURE_ASSIGNMENTS:-true}
      ACADEMY_FEATURE_COMPLETION: ${ACADEMY_FEATURE_COMPLETION:-true}
      ACADEMY_FEATURE_CERTIFICATES: ${ACADEMY_FEATURE_CERTIFICATES:-true}
      ACADEMY_FEATURE_DRIP: ${ACADEMY_FEATURE_DRIP:-true}
      ACADEMY_COMPLETION_REQUIRE_ALL_ACCESSIBLE_LESSONS: ${ACADEMY_COMPLETION_REQUIRE_ALL_ACCESSIBLE_LESSONS:-true}
      ACADEMY_CERTIFICATE_ISSUER_NAME: ${ACADEMY_CERTIFICATE_ISSUER_NAME:-}
      ACADEMY_CERTIFICATE_TITLE: ${ACADEMY_CERTIFICATE_TITLE:-Certificat de réussite}
      ACADEMY_CERTIFICATE_PUBLIC_VERIFICATION: ${ACADEMY_CERTIFICATE_PUBLIC_VERIFICATION:-true}
      ACADEMY_CERTIFICATE_PDF_DOWNLOAD: ${ACADEMY_CERTIFICATE_PDF_DOWNLOAD:-true}
      ACADEMY_CERTIFICATE_STUDENT_SHARING: ${ACADEMY_CERTIFICATE_STUDENT_SHARING:-true}
      ACADEMY_BOOTSTRAP_OWNER_NAME: ${ACADEMY_BOOTSTRAP_OWNER_NAME:-}
      ACADEMY_BOOTSTRAP_OWNER_EMAIL: ${ACADEMY_BOOTSTRAP_OWNER_EMAIL:-}
      ACADEMY_BOOTSTRAP_OWNER_PASSWORD: ${ACADEMY_BOOTSTRAP_OWNER_PASSWORD:-}
      COOLIFY_API_URL: ${COOLIFY_API_URL:-}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
      COOLIFY_SERVER_UUID: ${COOLIFY_SERVER_UUID:-}
      COOLIFY_DESTINATION_UUID: ${COOLIFY_DESTINATION_UUID:-}
      ACADEMY_FACTORY_SOURCE_MODE: ${ACADEMY_FACTORY_SOURCE_MODE:-public}
      ACADEMY_FACTORY_GIT_REPOSITORY: ${ACADEMY_FACTORY_GIT_REPOSITORY:-}
      ACADEMY_FACTORY_GIT_BRANCH: ${ACADEMY_FACTORY_GIT_BRANCH:-main}
      ACADEMY_FACTORY_PRIVATE_KEY_UUID: ${ACADEMY_FACTORY_PRIVATE_KEY_UUID:-}
      ACADEMY_FACTORY_COMPOSE_LOCATION: ${ACADEMY_FACTORY_COMPOSE_LOCATION:-/docker-compose.coolify.yml}
      ACADEMY_FACTORY_DOMAIN_SCHEME: ${ACADEMY_FACTORY_DOMAIN_SCHEME:-https}
      ACADEMY_FACTORY_HEALTH_PATH: ${ACADEMY_FACTORY_HEALTH_PATH:-/up}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-num_academy}
      DB_USERNAME: ${DB_USERNAME:-num_academy}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: null
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      FILESYSTEM_DISK: public
      MEDIA_DISK: public
      INERTIA_SSR_ENABLED: "true"

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NÜM Academy}

      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CLIENT_ID: ${STRIPE_CLIENT_ID:-}
      STRIPE_TRAINER_PRICE_ID: ${STRIPE_TRAINER_PRICE_ID:-}
      ACADEMY_PLATFORM_FEE_BPS: ${ACADEMY_PLATFORM_FEE_BPS:-1500}
      ACADEMY_DEFAULT_AFFILIATE_BPS: ${ACADEMY_DEFAULT_AFFILIATE_BPS:-1000}
      ACADEMY_COMMERCE_CURRENCY: ${ACADEMY_COMMERCE_CURRENCY:-EUR}

      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_ENDPOINT_URL: ${IMAGEKIT_ENDPOINT_URL:-}

      ACADEMY_AI_PROVIDER: ${ACADEMY_AI_PROVIDER:-disabled}
      ACADEMY_AI_TIMEOUT: ${ACADEMY_AI_TIMEOUT:-90}
      ACADEMY_AI_MODEL: ${ACADEMY_AI_MODEL:-}
      ACADEMY_AI_BASE_URL: ${ACADEMY_AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}

      ACADEMY_TUTOR_ENABLED: ${ACADEMY_TUTOR_ENABLED:-true}
      ACADEMY_TUTOR_PROVIDER: ${ACADEMY_TUTOR_PROVIDER:-inherit}
      ACADEMY_TUTOR_MODEL: ${ACADEMY_TUTOR_MODEL:-}
      ACADEMY_TUTOR_PREMIUM_MODEL: ${ACADEMY_TUTOR_PREMIUM_MODEL:-}
      ACADEMY_TUTOR_PERSONALITY: ${ACADEMY_TUTOR_PERSONALITY:-helpful}
      ACADEMY_TUTOR_OUTSIDE_CONTENT: ${ACADEMY_TUTOR_OUTSIDE_CONTENT:-never}
      ACADEMY_TUTOR_DAILY_LIMIT: ${ACADEMY_TUTOR_DAILY_LIMIT:-20}
      ACADEMY_TUTOR_MONTHLY_BUDGET_CENTS: ${ACADEMY_TUTOR_MONTHLY_BUDGET_CENTS:-0}
      ACADEMY_EMBEDDING_PROVIDER: ${ACADEMY_EMBEDDING_PROVIDER:-disabled}
      ACADEMY_EMBEDDING_MODEL: ${ACADEMY_EMBEDDING_MODEL:-text-embedding-3-small}
      ACADEMY_EMBEDDING_DIMENSIONS: ${ACADEMY_EMBEDDING_DIMENSIONS:-1536}
      ACADEMY_TUTOR_RETRIEVAL_LIMIT: ${ACADEMY_TUTOR_RETRIEVAL_LIMIT:-6}
      ACADEMY_TUTOR_RETRIEVAL_MIN_SIMILARITY: ${ACADEMY_TUTOR_RETRIEVAL_MIN_SIMILARITY:-0.20}
      ACADEMY_TUTOR_MAX_CONTEXT_CHARS: ${ACADEMY_TUTOR_MAX_CONTEXT_CHARS:-18000}
      ACADEMY_TUTOR_CONVERSATION_MESSAGES: ${ACADEMY_TUTOR_CONVERSATION_MESSAGES:-8}
      ACADEMY_TUTOR_INPUT_COST_PER_MILLION_CENTS: ${ACADEMY_TUTOR_INPUT_COST_PER_MILLION_CENTS:-0}
      ACADEMY_TUTOR_OUTPUT_COST_PER_MILLION_CENTS: ${ACADEMY_TUTOR_OUTPUT_COST_PER_MILLION_CENTS:-0}

      TOWER_ENABLED: ${TOWER_ENABLED:-false}
      TOWER_CHAT_ENABLED: ${TOWER_CHAT_ENABLED:-true}
      TOWER_CHAT_HISTORY_MESSAGES: ${TOWER_CHAT_HISTORY_MESSAGES:-8}
      TOWER_CHAT_MAX_MESSAGE_LENGTH: ${TOWER_CHAT_MAX_MESSAGE_LENGTH:-12000}
      TOWER_CHAT_AUTO_RUN_READ: ${TOWER_CHAT_AUTO_RUN_READ:-true}
      TOWER_CHAT_SUMMARY_TRIGGER_MESSAGES: ${TOWER_CHAT_SUMMARY_TRIGGER_MESSAGES:-16}
      TOWER_CHAT_SUMMARY_BATCH_MESSAGES: ${TOWER_CHAT_SUMMARY_BATCH_MESSAGES:-16}
      TOWER_CHAT_MAX_SUMMARY_LENGTH: ${TOWER_CHAT_MAX_SUMMARY_LENGTH:-6000}
      TOWER_MEMORY_ENABLED: ${TOWER_MEMORY_ENABLED:-true}
      TOWER_MEMORY_MAX_CONTEXT: ${TOWER_MEMORY_MAX_CONTEXT:-8}
      TOWER_MEMORY_SEMANTIC: ${TOWER_MEMORY_SEMANTIC:-true}
      TOWER_MEMORY_RETENTION_DAYS: ${TOWER_MEMORY_RETENTION_DAYS:-365}
      TOWER_MEMORY_THREAD_RETENTION_DAYS: ${TOWER_MEMORY_THREAD_RETENTION_DAYS:-30}
      TOWER_AI_PROVIDER: ${TOWER_AI_PROVIDER:-inherit}
      TOWER_AI_MODEL: ${TOWER_AI_MODEL:-}
      TOWER_ACADEMY_MCP_URL: ${TOWER_ACADEMY_MCP_URL:-http://127.0.0.1/mcp}
      TOWER_ACADEMY_MCP_TOKEN: ${TOWER_ACADEMY_MCP_TOKEN:-}
      TOWER_ACADEMY_MCP_TIMEOUT: ${TOWER_ACADEMY_MCP_TIMEOUT:-10}
      TOWER_ACADEMY_MCP_IN_PROCESS: ${TOWER_ACADEMY_MCP_IN_PROCESS:-true}
      TOWER_OBSERVATORY_ENABLED: ${TOWER_OBSERVATORY_ENABLED:-true}
      TOWER_OBSERVATORY_REFUND_RATE_WARN: ${TOWER_OBSERVATORY_REFUND_RATE_WARN:-5}
      TOWER_OBSERVATORY_CONVERSION_DROP_PCT: ${TOWER_OBSERVATORY_CONVERSION_DROP_PCT:-15}
      TOWER_OBSERVATORY_LEARNING_RISK_PCT: ${TOWER_OBSERVATORY_LEARNING_RISK_PCT:-25}
      TOWER_OBSERVATORY_EVENT_FILL_WARN: ${TOWER_OBSERVATORY_EVENT_FILL_WARN:-30}
      TOWER_OBSERVATORY_COMMUNITY_SILENCE_HOURS: ${TOWER_OBSERVATORY_COMMUNITY_SILENCE_HOURS:-72}
      TOWER_OBSERVATORY_AI_COST_SPIKE_PCT: ${TOWER_OBSERVATORY_AI_COST_SPIKE_PCT:-50}
      TOWER_OBSERVATORY_AI_COST_MIN_BASELINE_CENTS: ${TOWER_OBSERVATORY_AI_COST_MIN_BASELINE_CENTS:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - academy-storage:/var/www/html/storage/app/public
      - academy-assignments:/var/www/html/storage/app/private/assignments

  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-num_academy}
      POSTGRES_USER: ${DB_USERNAME:-num_academy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - academy-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - academy-redis:/data

volumes:
  academy-storage:
  academy-assignments:
  academy-postgres:
  academy-redis:
